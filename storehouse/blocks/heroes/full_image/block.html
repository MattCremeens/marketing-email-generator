<table role="presentation" width="100%" style="background-color:{{ background_color }};"><tr><td align="center"><img src="{{ image_url }}" alt="{{ alt_text }}" width="600" style="display:block;width:100%;max-width:600px;"></td></tr><tr><td align="center" style="padding:28px;color:{{ text_color }};font-family:{{ body_font }};"><h1 style="color:{{ heading_color }};font-family:{{ heading_font }};">{{ headline }}</h1><p>{{ body }}</p><a href="{{ cta_url }}" style="display:inline-block;padding:12px 22px;background-color:{{ button_background }};color:{{ button_text_color }};text-decoration:none;border-radius:{{ button_border_radius }}px;">{{ cta_text }}</a></td></tr></table>
