<table role="presentation" width="100%" style="background-color:{{ background_color }};"><tr>{% for product in products %}<td width="50%" align="center" valign="top" style="padding:16px;color:{{ text_color }};font-family:{{ body_font }};"><img src="{{ product.image_url }}" alt="{{ product.alt_text }}" width="260" style="display:block;width:100%;max-width:260px;"><h3 style="color:{{ heading_color }};font-family:{{ heading_font }};">{{ product.name }}</h3><p>{{ product.description }}</p>{% if product.cta_url %}<a href="{{ product.cta_url }}" style="color:{{ accent_color }};font-weight:bold;">{{ product.cta_text }}</a>{% endif %}</td>{% endfor %}</tr></table>
