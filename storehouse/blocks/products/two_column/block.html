<table role="presentation" width="100%"><tr>{% for product in products %}<td width="50%" align="center" valign="top" style="padding:16px;"><img src="{{ product.image_url }}" alt="{{ product.alt_text }}" width="260" style="display:block;width:100%;max-width:260px;"><h3>{{ product.name }}</h3><p>{{ product.description }}</p>{% if product.cta_url %}<a href="{{ product.cta_url }}">{{ product.cta_text }}</a>{% endif %}</td>{% endfor %}</tr></table>
